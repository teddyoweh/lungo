name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./internal/... ./cmd/...
      - run: make cli-all VERSION=${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with: { name: sky-cli, path: dist/* }

  desktop:
    strategy:
      matrix:
        include:
          - { os: macos-latest, platform: darwin/universal }
          - { os: windows-latest, platform: windows/amd64 }
          - { os: ubuntu-24.04, platform: linux/amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - working-directory: desktop
        shell: bash
        run: |
          tags=""
          [ "$RUNNER_OS" = Linux ] && tags="-tags webkit2_41"
          wails build -clean -platform ${{ matrix.platform }} $tags -ldflags "-X main.Version=${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with: { name: skybuild-${{ runner.os }}, path: desktop/build/bin/* }
